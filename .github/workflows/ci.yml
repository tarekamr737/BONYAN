name: Baseline CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://api.ci.bonyan.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:lint
      - run: npm run mobile:export:release
      - run: npm run mobile:routes
      - run: npm run mobile:typecheck
      - run: npm run mobile:test

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bonyan
          POSTGRES_USER: bonyan
          POSTGRES_PASSWORD: bonyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bonyan -d bonyan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      API_ENV: test
      DATABASE_URL: postgresql+asyncpg://bonyan:bonyan@127.0.0.1:5432/bonyan
      CHAT_MODEL: TBD
      AVATAR_MODEL: TBD
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "./apps/api[dev]"
      - run: python -m ruff check --config apps/api/pyproject.toml apps/api/app tests deployment
      - run: python -m pytest -c apps/api/pyproject.toml
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: python -m alembic -c apps/api/alembic.ini check
      - name: V2 PostgreSQL authorization, concurrency and bilingual journeys
        env:
          BONYAN_V2_TEST_DATABASE_URL: postgresql+asyncpg://bonyan:bonyan@127.0.0.1:5432/bonyan
        run: python -m pytest -c apps/api/pyproject.toml tests/api/test_game_v2.py tests/api/test_game_community_v2.py tests/api/test_v2_journey.py tests/training/test_session_substitutions.py tests/community/test_privacy_v2.py
      - name: Reversible V2 migrations on disposable CI database
        run: |
          python -m alembic -c apps/api/alembic.ini downgrade 20260921_0013
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini check
      - run: python deployment/smoke_check.py --help

  release-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/api.Dockerfile
          push: false
