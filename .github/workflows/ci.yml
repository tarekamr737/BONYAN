name: Baseline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:lint
      - run: npm run mobile:typecheck
      - run: npm run mobile:test
      - run: npm run mobile:export:web

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bonyan
          POSTGRES_USER: bonyan
          POSTGRES_PASSWORD: bonyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bonyan -d bonyan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      API_ENV: test
      DATABASE_URL: postgresql+asyncpg://bonyan:bonyan@127.0.0.1:5432/bonyan
      CHAT_MODEL: TBD
      AVATAR_MODEL: TBD
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "./apps/api[dev]"
      - run: python -m ruff check --config apps/api/pyproject.toml apps/api/app tests/api tests/community
      - run: python -m pytest -c apps/api/pyproject.toml
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
