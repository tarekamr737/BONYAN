services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: compose.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - staging_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: deployment/api.Dockerfile
    env_file: api.env
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deployment/api.Dockerfile
    restart: unless-stopped
    env_file: api.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - staging_private_objects:/var/lib/bonyan/private

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: compose.env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config

volumes:
  staging_postgres:
  staging_private_objects:
  staging_caddy_data:
  staging_caddy_config:
