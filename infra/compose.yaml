services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bonyan
      POSTGRES_USER: bonyan
      POSTGRES_PASSWORD: bonyan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonyan -d bonyan"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - bonyan_postgres_data:/var/lib/postgresql/data

volumes:
  bonyan_postgres_data:
