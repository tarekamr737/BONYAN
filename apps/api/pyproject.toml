[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bonyan-api"
version = "0.1.0"
description = "BONYAN shared FastAPI platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.19.1,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.141.1,<0.142",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.21,<0.1",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.16.4,<0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.integrations.avatar" = ["assets/*.png"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["../../tests/api", "../../tests/community"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
